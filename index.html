<!doctype html><meta charset=utf-8><title>Whiteboard cropper</title>
<style>
body{margin:0;font:14px system-ui;background:#1e1e1e;color:#ddd;display:flex;height:100vh}
#side{width:230px;overflow:auto;border-right:1px solid #333}
#side div{padding:4px 8px;cursor:pointer;font-family:monospace;font-size:12px}
#side div.sel{background:#2d5da8}#side div.ed{color:#7fdc7f}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar,#bar2{padding:6px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #333;flex-wrap:wrap}
button{background:#3a3a3a;color:#ddd;border:1px solid #555;padding:5px 10px;border-radius:4px;cursor:pointer}
button:hover{background:#4a4a4a}button.on{background:#2d5da8;border-color:#5b8fd8}#run{background:#2d7a2d}
#wrap{flex:1;display:flex;min-height:0}
#cv{background:#111;cursor:crosshair;flex:none}
#pv{width:340px;border-left:1px solid #333;padding:8px;box-sizing:border-box}#pv img{width:100%}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}#ov>div{background:#2a2a2a;padding:18px 22px;border-radius:8px;min-width:380px}#pb{height:10px;background:#444;border-radius:5px;overflow:hidden;margin:10px 0}#pbi{height:100%;width:0;background:#4caf50}
</style>
<div id=side></div>
<div id=main>
 <div id=bar>
  <button id=prev>◀ Prev</button><button id=next>Next ▶</button>
  <b id=title></b><span id=status></span>
  <button id=reset>Reset to auto</button>
  <button id=copy>Copy quad from previous</button>
  <button id=pvb>Preview crop (P)</button>
  <label><input type=checkbox id=onlyed> edited only</label>
  <button id=add>Add images…</button><button id=auto2>Auto-crop new</button><button id=setref title="Use this photo and its current crop as the reference for auto-crop">Set as reference</button><button id=exp>Export</button><button id=imp>Import</button><input type=file id=impf accept=.json style="display:none"><span style="flex:1"></span><button id=run>Run cropper → corrected/</button>
 </div>
 <div id=bar2>
  <b>Edit:</b>
  <button data-m=-1 class=mb>Free (0)</button><button data-m=0 class=mb>TL (1)</button><button data-m=1 class=mb>TR (2)</button><button data-m=2 class=mb>BR (3)</button><button data-m=3 class=mb>BL (4)</button>
  <label><input type=checkbox id=auto checked> auto-next on click</label>
  <label>Zoom <input type=range id=zoom min=1 max=20 step=0.5 value=6 style="vertical-align:middle"> <span id=zv>6×</span></label>
  <span id=hint style="color:#999"></span>
 </div>
 <div id=wrap><canvas id=cv></canvas><div id=pv><div>Crop preview</div><img id=pvimg></div></div>
</div>
<div id=ov><div><b id=ovt></b><div id=pb><div id=pbi></div></div><div id=ovs></div><div style="margin-top:10px"><button id=ovc>Cancel</button> <button id=ovx style="display:none">Close</button></div></div></div>
<script>
let imgs=[],idx=0,im=new Image(),drag=-1,mode=-1,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
async function load(){imgs=(await (await fetch('/api/state')).json()).images;list();show(0)}
function list(){const s=$('side');s.innerHTML='';imgs.forEach((o,i)=>{if($('onlyed').checked&&!o.edited)return;const d=document.createElement('div');d.textContent=o.name.replace('.jpg','');d.className=(i==idx?'sel ':'')+(o.edited?'ed':'');d.onclick=()=>show(i);d.id='i'+i;s.appendChild(d)})}
function src(i){return (mode>=0?'/full/':'/img/')+imgs[i].id}
function show(i){idx=Math.max(0,Math.min(imgs.length-1,i));const n=new Image();n.onload=()=>{if(imgs[idx].id!==n.dataset.n)return;im=n;fit();draw();pv()};n.dataset.n=imgs[idx].id;n.src=src(idx);
 if(mode>=0&&idx+1<imgs.length){const p=new Image();p.src=src(idx+1)}
 $('title').textContent=`${idx+1}/${imgs.length}  ${imgs[idx].name}`;$('status').textContent=imgs[idx].edited?'(edited)':imgs[idx].auto?'(auto)':'(no auto-crop yet)';
 document.querySelectorAll('#side div').forEach(d=>d.classList.remove('sel'));const e=$('i'+idx);if(e){e.classList.add('sel');e.scrollIntoView({block:'nearest'})}}
let sc=1,ox=0,oy=0,base=1;
function fit(){const pr=cv.parentElement.getBoundingClientRect(),w=Math.floor(pr.width-342),h=Math.floor(pr.height);cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w;cv.height=h;
 base=Math.min(w/im.width,h/im.height);
 if(mode>=0){const c=imgs[idx].quad[mode];sc=base*$('zoom').value;ox=w/2-c[0]*im.width*sc;oy=h/2-c[1]*im.height*sc}
 else{sc=base;ox=(w-im.width*sc)/2;oy=(h-im.height*sc)/2}}
const P=p=>[ox+p[0]*im.width*sc,oy+p[1]*im.height*sc];
const NAMES=['TL','TR','BR','BL'];
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,ox,oy,im.width*sc,im.height*sc);const q=imgs[idx].quad.map(P);
 ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.stroke();
 q.forEach((p,i)=>{const act=i==mode;ctx.fillStyle=act?'#00e5ff':'#ffd400';ctx.beginPath();ctx.arc(p[0],p[1],act?9:7,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='10px sans-serif';ctx.fillText(NAMES[i],p[0]-6,p[1]+3)});
 if(mode>=0){ctx.strokeStyle='rgba(0,229,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cv.width/2,0);ctx.lineTo(cv.width/2,cv.height);ctx.moveTo(0,cv.height/2);ctx.lineTo(cv.width,cv.height/2);ctx.stroke()}}
function pos(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;return [(x-ox)/(im.width*sc),(y-oy)/(im.height*sc)]}
cv.onmousedown=e=>{const p=pos(e),q=imgs[idx].quad;let b=mode;if(b<0){let bd=1e9;q.forEach((c,i)=>{const d=Math.hypot((c[0]-p[0])*im.width*sc,(c[1]-p[1])*im.height*sc);if(d<bd){bd=d;b=i}})}drag=b;q[b]=p;draw()};
cv.onmousemove=e=>{if(drag<0)return;imgs[idx].quad[drag]=pos(e);draw()};
window.onmouseup=async()=>{if(drag<0)return;drag=-1;await save();if(mode>=0&&$('auto').checked&&idx+1<imgs.length)show(idx+1);else{if(mode>=0)fit();draw();pv()}};
async function save(){const o=imgs[idx];o.edited=true;await fetch('/api/save',{method:'POST',body:JSON.stringify({id:o.id,quad:o.quad})});$('status').textContent='(edited)';const e=$('i'+idx);if(e)e.classList.add('ed')}
function pv(){$('pvimg').src='/api/preview?id='+imgs[idx].id+'&quad='+encodeURIComponent(JSON.stringify(imgs[idx].quad))+'&t='+Date.now()}
function setMode(m){mode=m;document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',+b.dataset.m===m));
 $('hint').textContent=m>=0?`Click the true ${NAMES[m]} corner — view is zoomed on it`:'Click anywhere: nearest dot jumps there';if(imgs.length)show(idx)}
document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
$('zoom').oninput=()=>{$('zv').textContent=$('zoom').value+'×';if(mode>=0){fit();draw()}};
$('prev').onclick=()=>show(idx-1);$('next').onclick=()=>show(idx+1);$('pvb').onclick=pv;
$('reset').onclick=async()=>{const o=imgs[idx];o.quad=JSON.parse(JSON.stringify(o.default));o.edited=false;await fetch('/api/save',{method:'POST',body:JSON.stringify({id:o.id,quad:null})});show(idx);list()};
$('copy').onclick=async()=>{if(idx>0){imgs[idx].quad=JSON.parse(JSON.stringify(imgs[idx-1].quad));fit();draw();await save();pv()}};
$('onlyed').onchange=list;
async function post(u,b){return (await fetch(u,{method:'POST',body:JSON.stringify(b||{})})).json()}
async function reload(){const cur=imgs[idx]&&imgs[idx].id;await load();const k=imgs.findIndex(o=>o.id===cur);if(k>=0)show(k)}
async function watch(title){const ov=$('ov');ov.style.display='flex';$('ovt').textContent=title;$('ovx').style.display='none';$('ovc').style.display='';
 for(;;){const j=await (await fetch('/api/job')).json();const pct=j.total?100*j.done/j.total:100;$('pbi').style.width=pct+'%';
  $('ovs').textContent=`${j.done} / ${j.total}  ${j.current||''}`+(j.errors&&j.errors.length?`  (${j.errors.length} errors)`:'');
  if(j.state!=='running'){$('ovs').textContent+=`  — ${j.state}`+(j.errors&&j.errors.length?'\n'+j.errors.slice(0,3).join('; '):'');$('ovc').style.display='none';$('ovx').style.display='';return j}
  await new Promise(r=>setTimeout(r,400))}}
$('ovc').onclick=()=>post('/api/cancel');$('ovx').onclick=()=>{$('ov').style.display='none'};
$('add').onclick=async()=>{const r=await post('/api/pick');if(r.error)return alert(r.error);if(r.added){await reload();if(confirm(`Added ${r.added} photo(s). Run auto-crop on them now for a starting point?`))$('auto2').click()}};
$('auto2').onclick=async()=>{const r=await post('/api/autocrop',{scope:'new'});if(r.error)return alert(r.error);await watch('Auto-cropping new photos…');await reload()};
$('setref').onclick=async()=>{if(confirm(`Use ${imgs[idx].name} with its current crop as the reference for auto-crop?`))await post('/api/reference',{id:imgs[idx].id})};
$('exp').onclick=()=>{location.href='/api/export'};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=await (await fetch('/api/import',{method:'POST',body:await f.text()})).json();e.target.value='';
 if(r.error){alert('Import failed: '+r.error);return}alert(`Imported: ${r.updated} updated, ${r.added} added, ${r.skipped_missing_files} skipped (file not found)`);const cur=imgs[idx]&&imgs[idx].id;await load();const k=imgs.findIndex(o=>o.id===cur);if(k>=0)show(k)};
$('run').onclick=async()=>{$('run').textContent='Running…';const r=await (await fetch('/api/run',{method:'POST',body:'{}'})).json();$('run').textContent='Run cropper → corrected/';alert(`Wrote ${r.count} images to ${r.dir}`)};
window.onkeydown=e=>{const k=e.key;if(k=='ArrowRight'||k=='ArrowDown'){e.preventDefault();show(idx+1)}else if(k=='ArrowLeft'||k=='ArrowUp'){e.preventDefault();show(idx-1)}
 else if(k=='p')pv();else if('01234'.includes(k)&&k.length==1)setMode(+k-1);
 else if(k=='+'||k=='='){$('zoom').value=+$('zoom').value+1;$('zoom').oninput()}else if(k=='-'){$('zoom').value=+$('zoom').value-1;$('zoom').oninput()}
 if(document.activeElement&&document.activeElement.type!='range')document.activeElement.blur()};
window.onresize=()=>{fit();draw()};setMode(-1);load();
</script>
